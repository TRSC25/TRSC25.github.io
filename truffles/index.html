<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine Clock</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        .clock {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5vw; 
            letter-spacing: 0.5vw; ;
        }

        .digit {
            width: 8vw;
            height: 12vw;
            overflow: hidden;
            position: relative;
            display: inline-block;
            background: #222;
            border-radius: 1vw;
            margin: 0 0.2em
        }

        .digit span {
            position: absolute;
            width: 100%;
            font-size: 5vw; 
            text-align: center;
            line-height: 12vw;
        }

        .digit span:nth-child(1) {
            top: 0;
        }

        .digit span:nth-child(2) {
            top: 100%;
        }

        .digit span:nth-child(3) {
            top: 200%;
        }

        .digit span:nth-child(4) {
            top: 300%;
        }

        span {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="clock" onclick="toggleTimeFormat()">
        <div class="digit" id="hour1">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>0</span>
        </div>
        <div class="digit" id="hour2">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>0</span>
        </div>
        <span>:</span>
        <div class="digit" id="minute1">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>0</span>
        </div>
        <div class="digit" id="minute2">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>0</span>
        </div>
        <span>:</span>
        <div class="digit" id="second1">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>0</span>
        </div>
        <div class="digit" id="second2">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>0</span>
        </div>
        <div class="digit" id="ampm">
            <span>A</span>
            <span>P</span>
        </div>
    </div>

    <script>
        var is24Hour = false;

        // Toggle function for 24-hour format
        function toggleTimeFormat() {
            is24Hour = !is24Hour;
            updateClock();
        }

        function updateClock() {
            const ampm = document.getElementById("ampm");
            if(is24Hour) {
                ampm.style.display = 'none';
            } else {
                ampm.style.display = 'block';
            }

            const now = new Date();
            const hours = (is24Hour) ? (now.getHours()) : (now.getHours() > 12) ? (now.getHours() - 12) : (now.getHours() === 00) ? 12 : now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hour1 = Math.floor(hours / 10);
            const hour2 = hours % 10;
            const minute1 = Math.floor(minutes / 10);
            const minute2 = minutes % 10;
            const second1 = Math.floor(seconds / 10);
            const second2 = seconds % 10;

            function scrollDigit(digitElement, value) {
                const spans = digitElement.querySelectorAll('span');
                const previousValue = parseInt(digitElement.dataset.previousValue);

                let isSpecialCase = false;

                if (value === 0 && previousValue !== 0) {
                    value = previousValue + 1;
                    isSpecialCase = true;
                }

                if (value === 0 && previousValue === 0) {
                    spans.forEach((span, index) => {
                        span.style.transition = 'none';
                        span.style.top = `${(index - 0) * 100}%`;
                    });
                    return;
                }

                spans.forEach((span, index) => {
                    span.style.transition = 'top 0.5s ease';
                    span.style.top = `${(index - value) * 100}%`;
                });

                digitElement.dataset.previousValue = value;

                if (isSpecialCase) {
                    digitElement.dataset.previousValue = 0;
                    setTimeout(() => {
                        spans.forEach((span, index) => {
                            span.style.transition = 'none';
                            span.style.top = `${(index - 0) * 100}%`;
                        });
                    }, 500);
                }
            }

            scrollDigit(document.getElementById('hour1'), hour1);
            scrollDigit(document.getElementById('hour2'), hour2);
            scrollDigit(document.getElementById('minute1'), minute1);
            scrollDigit(document.getElementById('minute2'), minute2);
            scrollDigit(document.getElementById('second1'), second1);
            scrollDigit(document.getElementById('second2'), second2);

            var amp = (now.getHours() > 12) ? 1 : 0;
            scrollDigit(ampm, amp);
        }

        setInterval(updateClock, 1000);
        updateClock();

    </script>
</body>
</html>
